# Post-deploy smoke for the live curl installer. Manual (workflow_dispatch) only:
# it hits the network and https://boringinfra.company, so it is deliberately kept
# out of the push/PR CI in ci.yml.
name: Installer smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
      - run: sh scripts/smoke-live-installer.sh
