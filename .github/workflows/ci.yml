# Release gate for the developer preview: mirrors the local `npm run check`.
# The package smoke test (`npm run test:package`, part of `npm run check`)
# runs offline: it packs the tarball and installs it with `npm install
# --offline` into a temp prefix, so no external network access is needed.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:installer

  # Exercise the native PowerShell installer plus the installed `harnie.cmd`
  # shim. POSIX installer checks remain in the Ubuntu job above.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test -- tests/installer.test.ts
      - run: npm run test:package
